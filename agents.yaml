# Конфигурация агентов и серверов
# Запуск: python scripts/agent/agent.py --host home
# На каждом хосте указывается свой --host, остальное берётся из этого файла

hosts:

  home:
    # Домашний комп (Windows), подключён к роутеру с камерой 01
    backend_url: http://localhost:8000
    motion:
      threshold: 60
      heartbeat_sec: 600
      conf: 0.35
      nms: 0.45
      tcp: false
    cameras:
      CAM_01_9_U_URL: rtsp://192.168.1.9:554/user=hxdx&password=ha6fum&channel=0&stream=1.sdp?real_stream
      CAM_01_9_U_HI_URL: rtsp://192.168.1.9:554/user=hxdx&password=ha6fum&channel=0&stream=0.sdp?real_stream
      CAM_01_9_U_CROP_REL: "0,0,1,0.5"
      CAM_01_9_D_URL: rtsp://192.168.1.9:554/user=hxdx&password=ha6fum&channel=0&stream=1.sdp?real_stream
      CAM_01_9_D_HI_URL: rtsp://192.168.1.9:554/user=hxdx&password=ha6fum&channel=0&stream=0.sdp?real_stream
      CAM_01_9_D_CROP_REL: "0,0.5,1,0.5"

  server:
    # Продакшн сервер в интернете (Linux)
    backend_url: http://localhost:8000
    motion:
      threshold: 60
      heartbeat_sec: 600
      conf: 0.35
      nms: 0.45
      tcp: true
    cameras:
      CAM_02_URL: rtsp://<external_ip>:5541/user=admin&password=&channel=1&stream=1.sdp?real_stream
      CAM_03_URL: rtsp://<external_ip>:5542/user=admin&password=&channel=1&stream=1.sdp?real_stream
      CAM_04_URL: rtsp://<external_ip>:5543/user=admin&password=&channel=1&stream=1.sdp?real_stream
